<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Des lettres pour mon petit chou</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --board: #241811;
    --board-2: #2f2018;
    --paper: #f4e9d2;
    --paper-2: #ece0c4;
    --ink: #2b2013;
    --wax: #8c1f2b;
    --wax-soft: #b23a46;
    --gold: #c9a227;
    --pin-shadow: rgba(0,0,0,.5);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    font-family:'Work Sans', sans-serif;
    color:#efe4cf;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 26px),
      radial-gradient(ellipse at 50% 0%, var(--board-2), var(--board) 70%);
    position:relative;
    overflow-x:hidden;
  }

  /* faint ambient floating hearts */
  .ambient{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .ambient span{
    position:absolute; bottom:-40px;
    font-size: 14px;
    color: rgba(178,58,70,0.35);
    animation: rise linear infinite;
  }
  @keyframes rise{
    to{ transform: translateY(-115vh) rotate(20deg); opacity:0; }
  }

  header{
    position:relative; z-index:1;
    text-align:center;
    padding: 56px 20px 20px;
  }
  .eyebrow{
    font-family:'Work Sans', sans-serif;
    font-size:11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color: var(--gold);
    margin-bottom:16px;
  }
  h1{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(42px, 9vw, 68px);
    margin:0 0 8px;
    color: var(--paper);
    line-height:1;
  }
  header p{
    font-family:'EB Garamond', serif;
    font-style:italic;
    color:#c9bda0;
    font-size:15px;
    margin:0;
  }

  .board{
    position:relative; z-index:1;
    max-width: 980px;
    margin: 30px auto 70px;
    padding: 30px 24px 10px;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 42px 28px;
  }

  .envelope-wrap{
    display:flex; flex-direction:column; align-items:center;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .envelope-wrap:nth-child(odd) .envelope{ transform: rotate(-3deg); }
  .envelope-wrap:nth-child(even) .envelope{ transform: rotate(2.5deg); }
  .envelope-wrap:nth-child(3n) .envelope{ transform: rotate(-1.5deg); }
  .envelope-wrap:hover .envelope{ transform: translateY(-4px) rotate(0deg) scale(1.03); }

  .pin{
    width:12px; height:12px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #e8c96a, var(--gold) 60%, #8a6a12 100%);
    box-shadow: 0 3px 5px var(--pin-shadow);
    margin-bottom: -6px;
    z-index:2;
  }

  .envelope{
    position:relative;
    width: 100%;
    max-width: 220px;
    aspect-ratio: 3/2;
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    border-radius: 3px;
    box-shadow: 0 10px 22px rgba(0,0,0,.45);
    transition: transform .3s ease;
    overflow:hidden;
  }
  .envelope::before{ /* flap */
    content:"";
    position:absolute; top:0; left:0; right:0;
    height: 60%;
    background: linear-gradient(180deg, var(--paper-2), var(--paper));
    clip-path: polygon(0 0, 100% 0, 50% 78%);
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .seal{
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    width: 38px; height:38px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--wax-soft), var(--wax) 70%);
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center;
    font-family:'Caveat', cursive;
    font-size: 18px;
    color: rgba(255,255,255,.85);
    z-index:2;
  }

  .label{
    margin-top: 14px;
    font-family:'Caveat', cursive;
    font-size: 20px;
    color: var(--paper);
    text-align:center;
    line-height:1.25;
    max-width: 200px;
  }

  /* ---------- MODAL / LETTER ---------- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(10,7,4,0.75);
    backdrop-filter: blur(3px);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
    z-index: 10;
    opacity:0; pointer-events:none;
    transition: opacity .3s ease;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }

  .letter{
    position:relative;
    max-width: 520px;
    width:100%;
    max-height: 85vh;
    overflow-y:auto;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 33px, rgba(0,0,0,0.05) 34px),
      var(--paper);
    color: var(--ink);
    padding: 46px 40px;
    border-radius: 2px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transform: scale(.85) rotate(-1deg);
    opacity:0;
    transition: transform .4s cubic-bezier(.2,.9,.3,1.3), opacity .35s ease;
  }
  .overlay.show .letter{ transform: scale(1) rotate(0deg); opacity:1; }

  .letter-close{
    position:absolute; top:14px; right:16px;
    background:none; border:none;
    font-size: 22px;
    color: var(--ink);
    opacity:.5;
    cursor:pointer;
    line-height:1;
  }
  .letter-close:hover{ opacity:1; }

  .letter-label{
    font-family:'Work Sans', sans-serif;
    font-size:11px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color: var(--wax);
    margin-bottom: 18px;
  }
  .letter-salutation{
    font-family:'Caveat', cursive;
    font-size: 30px;
    color: var(--wax);
    margin: 0 0 14px;
  }
  .letter-body{
    font-family:'EB Garamond', serif;
    font-size: 18px;
    line-height:1.85;
    white-space: pre-line;
  }
  .letter-sign{
    font-family:'Caveat', cursive;
    font-size: 26px;
    color: var(--wax);
    margin-top: 22px;
    text-align:right;
  }

  @media (max-width: 820px){
    .board{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px){
    .board{ grid-template-columns: 1fr 1fr; gap: 34px 16px; }
    .letter{ padding: 34px 24px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ---------- INTRO SCREEN ---------- */
  #intro{
    position:fixed; inset:0;
    z-index: 20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding: 24px;
    background: radial-gradient(ellipse at 50% 30%, var(--board-2), var(--board) 75%);
    transition: opacity .6s ease, visibility .6s ease;
  }
  #intro.hide{ opacity:0; visibility:hidden; pointer-events:none; }

  #intro .eyebrow{ margin-bottom: 20px; }

  #intro h1{
    font-size: clamp(38px, 8vw, 60px);
    margin-bottom: 10px;
  }
  #intro .intro-sub{
    font-family:'EB Garamond', serif;
    font-style:italic;
    color:#c9bda0;
    font-size:15px;
    margin: 0 0 46px;
  }

  .big-envelope{
    position:relative;
    width: 220px; height: 150px;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .big-envelope .body{
    position:absolute; inset:0;
    background: linear-gradient(180deg, var(--paper), var(--paper-2));
    border-radius: 4px;
    box-shadow: 0 18px 40px rgba(0,0,0,.5);
  }
  .big-envelope .flap{
    position:absolute; top:0; left:0; right:0;
    height: 62%;
    background: linear-gradient(180deg, var(--paper-2), var(--paper));
    clip-path: polygon(0 0, 100% 0, 50% 82%);
    transform-origin: top center;
    transition: transform .6s cubic-bezier(.4,0,.2,1);
    z-index:2;
  }
  .big-envelope.open .flap{ transform: rotateX(178deg); }
  .big-envelope .seal{
    width: 52px; height:52px;
    font-size: 24px;
    top: 46%;
  }
  .big-envelope.open .seal{ opacity:0; transition: opacity .2s ease; }

  .enter-label{
    margin-top: 22px;
    font-family:'Work Sans', sans-serif;
    font-size: 12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color: var(--gold);
  }

  #main-content{
    opacity:0;
    transition: opacity .7s ease;
  }
  #main-content.show{ opacity:1; }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>

<div id="intro">
  <div class="eyebrow">Correspondance privée</div>
  <h1>Pour toi,<br>Dydy</h1>
  <p class="intro-sub">Quelques mots, mis de côté pour toi.</p>

  <div class="big-envelope" id="big-envelope" onclick="openIntro()">
    <div class="flap"></div>
    <div class="body"></div>
    <div class="seal">D</div>
  </div>
  <div class="enter-label">Clique pour ouvrir</div>
</div>

<div id="main-content">
  <header>
    <div class="eyebrow">Correspondance privée</div>
    <h1>Des lettres pour toi, Dydy</h1>
    <p>Clique sur une enveloppe pour l'ouvrir.</p>
  </header>

  <div class="board" id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="letter">
    <button class="letter-close" onclick="closeLetter()">×</button>
    <div class="letter-label" id="l-label"></div>
    <div class="letter-salutation" id="l-salutation">Mon petit chou,</div>
    <div class="letter-body" id="l-body"></div>
    <div class="letter-sign" id="l-sign">— Ton amoureuse</div>
  </div>
</div>

<script>
  const letters = [
    {
      label: "Ouvre quand tu doutes de toi",
      body: "Je ne sais pas ce qui te fait douter aujourd'hui, mais je voudrais que tu saches ce que je vois, moi : quelqu'un qui essaie, qui se relève, qui avance même quand c'est difficile. Tu es plus fort que ce que tu crois, et plus lumineux que ce que tu penses montrer. Respire. Ça va aller. Et je suis là."
    },
    {
      label: "Ouvre quand tu as besoin de rire",
      body: "Bon, officiellement cette lettre n'a aucune information utile. Elle sert juste à te rappeler ce petit rire que tu as quand tu essaies de ne pas rire, celui qui me fait craquer à chaque fois. Va te resservir un chocolat, mets une musique que tu aimes, et souris un peu — c'est un ordre."
    },
    {
      label: "Ouvre un jour de pluie",
      body: "S'il pleut dehors, j'espère qu'il fait un peu plus chaud ici, entre ces lignes. Les jours gris ont ça de bien qu'ils nous obligent à ralentir. Prends une couverture, prends ton temps, et sache que même loin de toi, je pense à toi bien plus que tu ne l'imagines."
    },
    {
      label: "Ouvre quand on est loin l'un de l'autre",
      body: "La distance est bête : elle ne change rien à ce que je ressens, elle rend juste les journées un peu plus longues. Alors en attendant de te retrouver, garde cette lettre comme une preuve que tu occupes mes pensées, même à travers les kilomètres."
    },
    {
      label: "Ouvre le jour de notre anniversaire",
      body: "Encore un an de plus à construire quelque chose qui me rendent fière et heureuse chaque jour. Merci d'être exactement celui que tu es. J'ai hâte d'écrire encore plein d'autres pages avec toi."
    },
    {
      label: "Ouvre quand tu relis ça dans 10 ans",
      body: "Si tu lis ces mots des années plus tard, j'espère que tu souris en te souvenant de ce moment précis. J'espère qu'on a traversé beaucoup de choses ensemble depuis, et que ce que je ressentais en écrivant ceci est resté vrai, en mieux encore."
    },
    {
      label: "Ouvre maintenant, juste parce que",
      body: "Pas de raison particulière, pas d'occasion spéciale. Juste l'envie de te dire que tu comptes énormément pour moi, aujourd'hui comme n'importe quel autre jour. Voilà. C'est tout. C'est déjà beaucoup."
    },
    {
      label: "Ouvre quand tu as le mal du pays",
      body: "Où que tu sois, sache qu'il y a toujours un endroit où tu es chez toi : c'est ici, avec moi. Prends soin de toi, et reviens vite — je garde une place au chaud."
    },
    {
      label: "Ouvre après une journée difficile",
      body: "Je ne sais pas ce que ta journée t'a mis sur le dos, mais pose-le une seconde. Tu as le droit d'être fatiguée, d'être en colère, de ne pas avoir toutes les réponses aujourd'hui. Demain sera différent. Et ce soir, je suis là, sans jugement, juste avec toi."
    },
    {
      label: "Ouvre aprés une dispute",
      body: "On vient peut-être de se prendre la tête, et c'est ok — ça arrive, même quand on s'aime fort. Mais je voulais que tu saches, même en plein milieu de l'énervement, que ça ne change rien à ce que je ressens pour toi. On va trouver les mots, on va se calmer, et on va s'en sortir. Comme toujours."
    },
    {
      label: "Ouvre quand tu te sens seule",
      body: "La solitude ment parfois, elle te fait croire que personne ne pense à toi. Alors voilà la preuve du contraire, noir sur blanc : tu occupes une place énorme dans ma tête, bien plus souvent que tu ne l'imagines."
    },
    {
      label: "Ouvre pour rien, juste pour sourire",
      body: "Aucune sagesse profonde ici, juste l'envie de te rappeler que tu as un sourire qui désarme tout le monde, y compris moi. Voilà. Mission accomplie si tu souris en lisant ça."
    }
  ];

  function openIntro(){
    const env = document.getElementById('big-envelope');
    env.classList.add('open');
    setTimeout(() => {
      document.getElementById('intro').classList.add('hide');
      document.getElementById('main-content').classList.add('show');
    }, 550);
  }

  const board = document.getElementById('board');
  letters.forEach((l, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'envelope-wrap';
    wrap.innerHTML = `
      <div class="pin"></div>
      <div class="envelope">
        <div class="seal">D</div>
      </div>
      <div class="label">${l.label}</div>
    `;
    wrap.addEventListener('click', () => openLetter(i));
    board.appendChild(wrap);
  });

  const overlay = document.getElementById('overlay');
  function openLetter(i){
    document.getElementById('l-label').textContent = letters[i].label;
    document.getElementById('l-body').textContent = letters[i].body;
    overlay.classList.add('show');
  }
  function closeLetter(){
    overlay.classList.remove('show');
  }
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) closeLetter();
  });

  // ambient floating hearts, low count, subtle
  const ambient = document.getElementById('ambient');
  const heartChars = ['♥','❤'];
  for(let i=0; i<8; i++){
    const s = document.createElement('span');
    s.textContent = heartChars[i % 2];
    s.style.left = (Math.random()*100) + '%';
    s.style.fontSize = (10 + Math.random()*10) + 'px';
    s.style.animationDuration = (14 + Math.random()*10) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    ambient.appendChild(s);
  }
</script>

</body>
</html>
